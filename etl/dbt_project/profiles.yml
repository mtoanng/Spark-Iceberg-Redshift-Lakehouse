nyc_hvfhs_lakehouse:
  target: glue
  outputs:
    glue:
      type: glue
      query-comment: "dbt-glue for NYC HVFHV Lakehouse"
      role_arn: "{{ env_var('GLUE_ROLE_ARN') }}"
      region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      workers: 2
      worker_type: G.1X
      glue_version: "4.0"
      session_provisioning_timeout_in_seconds: 300
      location: "{{ env_var('S3_GOLD_PATH') }}"
      datalake_formats: iceberg
      custom_iceberg_catalog_namespace: glue_catalog
      database: glue_catalog
      schema: gold
      conf: >-
        spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
        --conf spark.sql.catalog.glue_catalog=org.apache.iceberg.spark.SparkCatalog
        --conf spark.sql.catalog.glue_catalog.warehouse={{ env_var('S3_GOLD_PATH') }}
        --conf spark.sql.catalog.glue_catalog.catalog-impl=org.apache.iceberg.aws.glue.GlueCatalog
        --conf spark.sql.catalog.glue_catalog.io-impl=org.apache.iceberg.aws.s3.S3FileIO

    # Credential-independent parse/compile target. `dbt compile` must use
    # `--no-introspect`; the closed local port ensures accidental SQL execution
    # fails instead of starting Spark or contacting AWS.
    ci:
      type: spark
      method: thrift
      host: 127.0.0.1
      port: 1
      user: ci
      schema: gold
      connect_retries: 0
      connect_timeout: 1
