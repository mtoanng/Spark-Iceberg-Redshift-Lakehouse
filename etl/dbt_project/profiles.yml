nyc_hvfhs_lakehouse:
  target: redshift
  outputs:
    redshift:
      type: redshift
      method: iam_role
      host: "{{ env_var('REDSHIFT_HOST') }}"
      port: 5439
      database: "{{ env_var('REDSHIFT_DATABASE', 'lakehouse') }}"
      schema: gold
      threads: 2
      region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
      is_serverless: true
      serverless_work_group: "{{ env_var('REDSHIFT_WORKGROUP_NAME') }}"
      serverless_acct_id: "{{ env_var('AWS_ACCOUNT_ID') }}"
      sslmode: require
      connect_timeout: 10
      retries: 1

    # Credential-independent target. CI supplies non-secret, unreachable values.
    ci:
      type: redshift
      method: database
      host: "{{ env_var('DBT_CI_REDSHIFT_HOST') }}"
      port: 1
      user: "{{ env_var('DBT_CI_REDSHIFT_USER') }}"
      password: "{{ env_var('DBT_CI_REDSHIFT_PASSWORD') }}"
      database: "{{ env_var('DBT_CI_REDSHIFT_DATABASE') }}"
      schema: gold
      threads: 1
      connect_timeout: 1
      retries: 0
      sslmode: disable
