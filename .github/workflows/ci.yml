name: lakehouse-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-fixtures:
    name: Python fixtures and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install credential-independent test tools
        run: python -m pip install --requirement requirements-ci.txt
      - name: Validate repository hygiene
        run: python scripts/check_repository_hygiene.py
      - name: Compile Python
        run: python -m compileall -q athena etl scripts tests
      - name: Check Python formatting
        run: black --check athena etl scripts tests
      - name: Lint Python
        run: flake8 athena etl scripts tests --extend-ignore=E203,E501,W503
      - name: Run unit and contract tests
        run: python -m pytest -p no:cacheprovider tests/unit tests/contract -q
      - name: Validate Spark package contract
        run: python scripts/package_spark_jobs.py --output build/nyc_spark_jobs.zip --check
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Parse dbt graph without credentials
        working-directory: etl/dbt_project
        env:
          DBT_CI_REDSHIFT_HOST: 127.0.0.1
          DBT_CI_REDSHIFT_USER: ci
          DBT_CI_REDSHIFT_PASSWORD: ci-not-used
          DBT_CI_REDSHIFT_DATABASE: lakehouse
        run: dbt parse --profiles-dir . --target ci --no-partial-parse && dbt compile --profiles-dir . --target ci --no-partial-parse --no-introspect --no-populate-cache
      - name: Verify dbt graph contract
        run: python scripts/verify_dbt_manifest.py

  terraform:
    name: Terraform format and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"
      - name: Build Terraform file dependency
        run: python scripts/package_spark_jobs.py --output build/nyc_spark_jobs.zip --check
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate without a backend
        working-directory: terraform
        run: terraform init -backend=false && terraform validate
