version: '3.8'

services:
  # MongoDB - Recommendation Store (INTERNAL ONLY - no port mapping)
  mongodb:
    image: mongo:7.0
    container_name: instacart-mongodb
    restart: unless-stopped
    # NO PORT MAPPING - internal only, accessed via warehouse-api
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: instacart_warehouse
    volumes:
      - mongodb-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - warehouse-network

  # Warehouse API - FastAPI + DuckDB
  warehouse-api:
    build:
      context: .
      dockerfile: Dockerfile.warehouse
    container_name: instacart-warehouse-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB connection (internal only)
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/
      MONGODB_DATABASE: instacart_warehouse
      
      # AWS credentials (for S3 access)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      
      # S3 paths
      S3_BUCKET: ${S3_BUCKET}
      S3_GOLD_PATH: s3://${S3_BUCKET}/gold

      # DuckDB / Glue Catalog
      DUCKDB_PATH: ${DUCKDB_PATH:-warehouse/data/warehouse.db}
      USE_GLUE_CATALOG: ${USE_GLUE_CATALOG:-true}
      DUCKDB_ROLE_ARN: ${DUCKDB_ROLE_ARN}
      GLUE_DATABASE: ${GLUE_DATABASE}
      
      # API settings
      API_HOST: 0.0.0.0
      API_PORT: 8000
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./warehouse:/app/warehouse
      - ./config:/app/config
      - ~/.aws:/root/.aws:ro  # Mount AWS credentials
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - warehouse-network

  # MongoDB Express - Web UI for MongoDB (Optional)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: instacart-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    networks:
      - warehouse-network

volumes:
  mongodb-data:
    driver: local

networks:
  warehouse-network:
    driver: bridge
