version: 2

models:
  # Dimension Tables
  - name: dim_user
    description: "User dimension with behavioral metrics and segmentation"
    columns:
      - name: user_key
        description: "Surrogate key for user dimension"
        tests:
          - unique
          - not_null
      
      - name: user_id
        description: "Natural key - unique user identifier"
        tests:
          - unique
          - not_null
      
      - name: total_orders
        description: "Total number of orders placed by user"
        tests:
          - not_null
      
      - name: user_segment
        description: "User segmentation category"
        tests:
          - accepted_values:
              values: ['New', 'Active', 'Power', 'Unknown']
  
  - name: dim_product
    description: "Product dimension with full hierarchy"
    columns:
      - name: product_key
        description: "Surrogate key for product dimension"
        tests:
          - unique
          - not_null
      
      - name: product_id
        description: "Natural key - unique product identifier"
        tests:
          - unique
          - not_null
      
      - name: product_name
        description: "Product display name"
        tests:
          - not_null
      
      - name: department
        description: "Product department"
        tests:
          - not_null
  
  - name: dim_date
    description: "Calendar dimension table"
    columns:
      - name: date_key
        description: "Primary key in YYYYMMDD format"
        tests:
          - unique
          - not_null
      
      - name: date
        description: "Actual date value"
        tests:
          - unique
          - not_null
  
  # Fact Tables
  - name: fct_order_products
    description: "Fact table at order-product grain"
    columns:
      - name: order_product_key
        description: "Surrogate key for fact record"
        tests:
          - unique
          - not_null
      
      - name: order_id
        description: "Order identifier"
        tests:
          - not_null
      
      - name: product_id
        description: "Product identifier"
        tests:
          - not_null
      
      - name: user_id
        description: "User identifier"
        tests:
          - not_null
      
      - name: is_reordered
        description: "Whether product was reordered"
        tests:
          - not_null
